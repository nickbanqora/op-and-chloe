# Token vending provider configuration.
# Place this file at /etc/token-vending/config.yaml on the host.
# Secret files referenced below go in the same directory.
# Only providers with valid config AND matching secret files are enabled.

# GitHub App — vends short-lived installation tokens (1hr TTL)
# Setup: GitHub > Settings > Developer settings > GitHub Apps > New
# Only client_id and key_file are required. Installation ID is auto-discovered.
github:
  client_id: "Iv1.abc123def456"
  key_file: github-key.pem           # relative to /etc/token-vending/
  # installation_id: "78901234"      # optional — auto-discovered

# Google service account — vends OAuth2 access tokens (1hr TTL)
# Uses domain-wide delegation to access Workspace APIs on behalf of a user.
# Setup: GCP Console > IAM > Service Accounts > Create key (JSON)
#        Then enable domain-wide delegation in Workspace Admin > Security > API controls
# google:
#   service_account_file: google-sa.json
#   subject: user@company.com            # user to impersonate via delegation
#   default_scopes:
#     - https://www.googleapis.com/auth/gmail.modify
#     - https://www.googleapis.com/auth/calendar
#     - https://www.googleapis.com/auth/drive

# Linear — vends API tokens via OAuth2 client credentials (30-day TTL)
# Setup: Linear Settings > API > OAuth Applications > New
#        Enable "Client credentials tokens", note client ID.
#        Save the client secret to a file in the secrets dir.
# linear:
#   client_id: "your-oauth-client-id"
#   client_secret_file: linear-client-secret
#   scopes:                                # defaults to [read, write]
#     - read
#     - write

# Sentry — vends OAuth2 access tokens (30-day TTL)
# Setup: Create a Sentry OAuth app at sentry.io > Settings > Developer Settings > New Public Integration
#        Run scripts/host/sentry-oauth.sh <client_id> <client_secret> to get the refresh token.
# sentry:
#   client_id: "your-oauth-client-id"
#   client_secret_file: sentry-client-secret
#   refresh_token_file: sentry-refresh-token

# AWS — vends temporary credentials via STS AssumeRole (1hr TTL)
# Setup: Create an IAM user with only sts:AssumeRole permission.
#        Create a role with the permissions the agent needs (e.g. S3 read).
#        Save the IAM user's access key ID and secret to files in the secrets dir.
# aws:
#   role_arn: "arn:aws:iam::123456789012:role/openclaw-agent"
#   access_key_id_file: aws-access-key-id
#   secret_access_key_file: aws-secret-access-key
#   region: eu-west-2                      # defaults to eu-west-2
#   session_duration: 3600                 # seconds, defaults to 3600
#   session_name: openclaw-agent           # defaults to openclaw-agent

# Notion public integration — vends OAuth2 access tokens via refresh token
# Setup: notion.so/profile/integrations > New integration > Type: Public
# Do the OAuth flow locally to get the initial refresh token, then place
# the client secret and refresh token as files in the secrets dir.
# The sidecar updates the refresh token file on each use (Notion rotates it).
# notion:
#   client_id: "your-oauth-client-id"
#   client_secret_file: notion-client-secret
#   refresh_token_file: notion-refresh-token
